name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "23.10.1"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install -r scripts/requirements.txt

      - name: Lint Nextflow
        run: nextflow run main.nf --help

      - name: Run smoke pipeline (4-sample test data)
        run: bash tests/pipeline_tests/test_pipeline.sh

      - name: Python unit tests
        run: pytest tests/ -q || true

  r-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Syntax-check R scripts
        run: |
          Rscript -e 'parse("scripts/deseq2_analysis.R")'
          Rscript -e 'parse("scripts/functional_enrichment.R")'
